<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="studioTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0d9488" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Studio Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Inner Glow Accent -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#0d9488" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Graphic EQ Waveform Bars -->
  <g fill="url(#studioTeal)" filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="12" y="26" width="5" height="12" rx="2.5"/>
    <!-- Bar 2 -->
    <rect x="21" y="16" width="5" height="32" rx="2.5"/>
    <!-- Bar 3 (Center Peak) -->
    <rect x="30" y="10" width="5" height="44" rx="2.5" fill="#5eead4"/>
    <!-- Bar 4 -->
    <rect x="39" y="18" width="5" height="28" rx="2.5"/>
    <!-- Bar 5 -->
    <rect x="48" y="24" width="5" height="16" rx="2.5"/>
  </g>
</svg>
